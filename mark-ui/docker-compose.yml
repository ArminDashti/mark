name: mark

services:
  mark-ui:
    image: ${IMAGE_TAG:-mark-ui:latest}
    container_name: mark-ui
    build:
      context: .
      dockerfile: dockerfile
    expose:
      - "${INTERNAL_PORT:-80}"
    ports:
      - target: ${INTERNAL_PORT:-80}
        published: ${PUBLISH_PORT-8231}
        protocol: tcp
    environment:
      API_HOST: ${API_HOST:-mark-api}
      API_PORT: ${API_PORT:-8130}
    volumes:
      - ./nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
    networks:
      - app_net
    restart: "no"

networks:
  app_net:
    name: ${DOCKER_NETWORK:-mark-net}
    external: true